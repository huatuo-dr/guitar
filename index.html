<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="小k吉他练习的曲谱库，收录制作完成的指弹与弹唱伴奏吉他谱，支持在线查看与下载。">
  <title>曲谱库 · 小k吉他练习</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/home.css">
  <script src="./assets/catalog.js" defer></script>
  <script src="./assets/home.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#library">跳转到曲谱库</a>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="小k吉他练习首页"><span class="brand-mark" aria-hidden="true"></span>小k吉他练习</a>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy"><p class="eyebrow"><span aria-hidden="true"></span>MY GUITAR COLLECTION</p><h1 id="page-title">我的吉他谱</h1></div>
      <div class="collection-note" aria-hidden="true"><span class="note-lines"></span><span>一首一首，慢慢练。</span><span class="note-chord">♪</span></div>
    </section>
    <section class="library" id="library" aria-label="曲谱库">
      <div class="search-row">
        <div class="search-field"><label class="sr-only" for="search">搜索曲名或歌手</label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="search" type="search" placeholder="搜索曲名或歌手" autocomplete="off" maxlength="200" aria-controls="score-list"></div>
      </div>
      <div class="filter-row">
        <div class="filters" role="group" aria-label="按曲谱类型筛选">
          <button type="button" data-type="all" aria-pressed="true">全部<span class="filter-count" data-count="all">0</span></button>
          <button type="button" data-type="fingerstyle" aria-pressed="false">指弹<span class="filter-count" data-count="fingerstyle">0</span></button>
          <button type="button" data-type="accompaniment" aria-pressed="false">弹唱伴奏<span class="filter-count" data-count="accompaniment">0</span></button>
        </div>
        <div class="sort-field"><label for="sort">排序</label><select id="sort"><option value="updated">最近更新</option><option value="title">曲名排序</option></select></div>
      </div>
      <div class="list-heading"><h2>曲谱目录</h2><p id="result-count" role="status" aria-live="polite" aria-atomic="true"></p></div>
      <p id="catalog-status" role="status">正在加载曲谱目录…</p>
      <noscript><p class="notice">请启用 JavaScript 使用搜索和分类。也可以直接<a href="./sheet_music/偏爱指弹.html">打开《偏爱》指弹</a>。</p></noscript>
      <div id="score-list" class="score-list"></div>
      <div class="empty-state" hidden><span class="empty-symbol" aria-hidden="true">⌕</span><h3 id="empty-title">没有找到相关曲谱</h3><p id="empty-description">试试其他曲名，或查看全部曲谱。</p><button id="reset-filters" type="button">查看全部曲谱 <span aria-hidden="true">↗</span></button></div>
      <div class="library-footer"><a href="./docs/制谱.html">了解曲谱如何制作 <span aria-hidden="true">→</span></a></div>
    </section>
  </main>
  <footer class="site-footer"><span>小k吉他练习</span><span>把喜欢的歌，留在指尖。</span><a href="https://github.com/huatuo-dr/guitar">GitHub <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
